name: submit-dataset

# Проверяет submissions экспертов и публикует датасет на HuggingFace.
# Требуется секрет репозитория HF_TOKEN (write-доступ к целевому датасету).

on:
  push:
    branches: [main]
    paths:
      - 'assignments/00-first-contribution/submissions/**'
      - 'assignments/00-first-contribution/dataset-schema/**'
      - '.github/workflows/submit-dataset.yml'
  pull_request:
    paths:
      - 'assignments/00-first-contribution/submissions/**'
  workflow_dispatch:

jobs:
  publish:
    name: Проверка и публикация датасета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Валидатор умеет падать (selftest)
        run: python3 assignments/00-first-contribution/dataset-schema/validate.py --selftest

      - name: Проверка и сборка датасета (dry-run)
        run: |
          python3 assignments/00-first-contribution/dataset-schema/publish.py \
            --submissions-dir assignments/00-first-contribution/submissions \
            --out-dir dataset --dry-run

      - name: Публикация на HuggingFace (только push в main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet huggingface_hub
          python3 assignments/00-first-contribution/dataset-schema/publish.py \
            --submissions-dir assignments/00-first-contribution/submissions \
            --out-dir dataset \
            --repo-id chaotic-good-project/ip-law-expert-records
