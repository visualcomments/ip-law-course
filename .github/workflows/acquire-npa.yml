name: Массовый сбор НПА

# По расписанию — сбор манифеста официальных актов (только метаданные,
# без загрузки тел в CI). Ручной запуск — workflow_dispatch.
on:
  schedule:
    - cron: '0 4 * * 1'   # каждый понедельник, 04:00 UTC
  workflow_dispatch:
    inputs:
      acts_json:
        description: 'Путь к JSON-массиву карточек актов (в репозитории)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  manifest:
    name: Манифест официальных актов (metadata-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Каталог правовых тем
        run: python tools/acquire_npa.py topics

      - name: Собрать манифест (если задан acts_json)
        if: ${{ github.event.inputs.acts_json != '' }}
        run: |
          python tools/acquire_npa.py manifest \
            --acts-json "${{ github.event.inputs.acts_json }}" \
            --out .local/legal-bronze/candidates.jsonl

      - name: Тесты сбора (без сети)
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_acquire_npa.py -q

      - name: Проверить, что нет токенов и персональных данных
        run: |
          set -e
          if grep -rIE '(hf_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})' \
               .local/ 2>/dev/null; then
            echo "Найден секрет — публикация запрещена"; exit 1
          fi
          # Персональные данные слушателей не должны попадать в манифест.
          if grep -rIE '(@[a-z0-9.-]+\.[a-z]{2,}|student|участник|telegram)' \
               .local/legal-bronze/ 2>/dev/null; then
            echo "Найдены возможные персональные данные — сбор остановлен"; exit 1
          fi

      - name: Выгрузить манифест как артефакт (не в git)
        if: ${{ github.event.inputs.acts_json != '' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: legal-npa-manifest
          path: .local/legal-bronze/candidates.jsonl
          if-no-files-found: warn
          retention-days: 14
